[package]
name = "publish"
version = "0.1.0"
edition = "2024"

[dependencies]
shared-core = { path = "../shared-assets/shared-rust/shared-core" }
shared-frontend = { path = "../shared-assets/shared-rust/shared-frontend", features = ["csr"] }
yew = { version = "0.23", features = ["csr"] }
web-sys = { version = "=0.3.98", features = ["HtmlTextAreaElement", "EventTarget", "HtmlInputElement", "Window"] }
wasm-bindgen = "0.2"
pulldown-cmark = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gloo-timers = "0.3"
