[package]
name = "publish"
version = "0.3.0"
edition = "2024"

[dependencies]
shared-core = { path = "../shared-assets/shared-rust/shared-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
shared-frontend = { path = "../shared-assets/shared-rust/shared-frontend", features = ["csr"] }
yew = { version = "0.23", features = ["csr"] }
web-sys = { version = "=0.3.98", features = ["HtmlTextAreaElement", "EventTarget", "HtmlInputElement", "Window"] }
wasm-bindgen = "0.2"
pulldown-cmark = "0.12"
gloo-timers = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.0", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
